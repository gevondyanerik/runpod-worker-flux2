[project]
name = "runpod-worker-flux2"
version = "1.0.0"
description = "FLUX.2 klein worker for Runpod Serverless"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[tool.setuptools]
packages = ["app", "bootstrap"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = [
    "S101",  # asserts are used as type narrowing, not as validation
    "S104",  # binding 0.0.0.0 is never done here; the check misfires on docs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"scripts/*" = ["S", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = "^(tests|scripts)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]
